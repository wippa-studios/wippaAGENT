name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: bash -n install.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck install.sh
