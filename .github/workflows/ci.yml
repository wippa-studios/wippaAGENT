name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # npm ci installs exactly the committed lockfile; a dependency the
      # lockfile is missing fails here rather than resolving silently.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:claims
      - run: npm run check:tokens
      - run: ./install.sh --dry-run
      - run: npm run eval -- --check
      - run: bash -n install.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck install.sh
